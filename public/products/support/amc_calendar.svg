<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Gradients -->
    <linearGradient id="calendar-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="calendar-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="clock-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Group with shadow -->
  <g filter="url(#shadow)">
    <!-- 1. CALENDAR BACKPLANE (Standing Desk Calendar Style) -->
    <!-- Support Stand -->
    <polygon points="20,110 35,50 125,50 140,110" fill="#1e3a8a" opacity="0.8" />
    <!-- Back Cover -->
    <rect x="25" y="45" width="110" height="75" rx="6" fill="url(#calendar-base)" />
    
    <!-- White Calendar Pages -->
    <rect x="29" y="52" width="102" height="64" rx="4" fill="#ffffff" />
    <!-- Blue Header on page -->
    <path d="M 29 56 A 4 4 0 0 1 33 52 L 127 52 A 4 4 0 0 1 131 56 L 131 68 L 29 68 Z" fill="url(#calendar-header)" />
    
    <!-- Rings/Spiral (Top wire-o) -->
    <rect x="38" y="42" width="4" height="12" rx="2" fill="#94a3b8" />
    <rect x="52" y="42" width="4" height="12" rx="2" fill="#94a3b8" />
    <rect x="66" y="42" width="4" height="12" rx="2" fill="#94a3b8" />
    <rect x="80" y="42" width="4" height="12" rx="2" fill="#94a3b8" />
    <rect x="94" y="42" width="4" height="12" rx="2" fill="#94a3b8" />
    <rect x="108" y="42" width="4" height="12" rx="2" fill="#94a3b8" />
    <rect x="122" y="42" width="4" height="12" rx="2" fill="#94a3b8" />

    <!-- Text/Grid inside Calendar page -->
    <text x="35" y="62" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#ffffff" letter-spacing="1">TASKS</text>
    <text x="110" y="62" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" fill="#ffffff" opacity="0.8">2024</text>
    
    <!-- Grid dots representing calendar days -->
    <circle cx="40" cy="78" r="2.5" fill="#e2e8f0" />
    <circle cx="55" cy="78" r="2.5" fill="#e2e8f0" />
    <circle cx="70" cy="78" r="2.5" fill="#e2e8f0" />
    <circle cx="85" cy="78" r="2.5" fill="#3b82f6" />
    <circle cx="100" cy="78" r="2.5" fill="#e2e8f0" />
    <circle cx="115" cy="78" r="2.5" fill="#e2e8f0" />
    
    <circle cx="40" cy="90" r="2.5" fill="#e2e8f0" />
    <circle cx="55" cy="90" r="2.5" fill="#3b82f6" />
    <circle cx="70" cy="90" r="2.5" fill="#e2e8f0" />
    <circle cx="85" cy="90" r="2.5" fill="#e2e8f0" />
    <circle cx="100" cy="90" r="2.5" fill="#e2e8f0" />
    <circle cx="115" cy="90" r="2.5" fill="#e2e8f0" />

    <circle cx="40" cy="102" r="2.5" fill="#e2e8f0" />
    <circle cx="55" cy="102" r="2.5" fill="#e2e8f0" />
    <circle cx="70" cy="102" r="2.5" fill="#e2e8f0" />
    <circle cx="85" cy="102" r="2.5" fill="#e2e8f0" />
    <circle cx="100" cy="102" r="2.5" fill="#3b82f6" />
    <circle cx="115" cy="102" r="2.5" fill="#e2e8f0" />

    <!-- 2. CLOCK (Overlayed on bottom left of calendar) -->
    <!-- Outer Blue Bezel -->
    <circle cx="50" cy="115" r="32" fill="url(#clock-rim)" />
    <!-- Clock face -->
    <circle cx="50" cy="115" r="28" fill="#ffffff" />
    <!-- Center Pin -->
    <circle cx="50" cy="115" r="2.5" fill="#1e3a8a" />
    
    <!-- Hour markers (12, 3, 6, 9) -->
    <line x1="50" y1="90" x2="50" y2="93" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round" />
    <line x1="75" y1="115" x2="72" y2="115" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round" />
    <line x1="50" y1="140" x2="50" y2="137" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round" />
    <line x1="25" y1="115" x2="28" y2="115" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Hour/Minute hands (setting time to ~10:10) -->
    <!-- Hour Hand -->
    <line x1="50" y1="115" x2="38" y2="105" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" />
    <!-- Minute Hand -->
    <line x1="50" y1="115" x2="65" y2="102" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round" />

    <!-- 3. GREEN LEAVES (Overlayed on bottom right) -->
    <!-- Leaf 1 -->
    <path d="M 95 125 C 105 125, 115 118, 122 110 C 112 115, 100 118, 95 125 Z" fill="url(#leaf-grad)" />
    <path d="M 95 125 C 102 120, 115 115, 122 110" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.6" />
    
    <!-- Leaf 2 -->
    <path d="M 110 132 C 122 130, 130 122, 135 112 C 125 118, 115 122, 110 132 Z" fill="url(#leaf-grad)" transform="rotate(-15 110 132)" />
    
    <!-- Leaf 3 (Small) -->
    <path d="M 85 130 C 95 130, 102 125, 106 118 C 98 122, 90 125, 85 130 Z" fill="url(#leaf-grad)" transform="rotate(20 85 130)" />
  </g>
</svg>
